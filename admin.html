<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hap — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --ink:      #15121c;
    --panel:    #1f1830;
    --paper:    #fbf6ec;
    --accent:   #ff5a3c;
    --accent-ink:#5a1206;
    --spark:    #ffc24c;
    --muted:    #b3a8ce;
    --muted-2:  #8b7fae;
    --line:     rgba(251,246,236,0.14);
    --line-2:   rgba(251,246,236,0.28);

    --font-display:"Bricolage Grotesque","Segoe UI",sans-serif;
    --font-body:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
    --font-mono:"JetBrains Mono","Courier New",monospace;

    --edge: clamp(1rem, 4vw, 3rem);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--ink); color:var(--paper); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  h1,h2,p{ margin:0; }
  button{ font:inherit; cursor:pointer; border:none; }
  button[disabled]{ opacity:0.6; cursor:wait; }
  [hidden]{ display:none !important; }

  main{ max-width:1100px; margin-inline:auto; padding:clamp(2rem,6vh,4rem) var(--edge); }
  .eyebrow{ font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
  h1{ font-family:var(--font-display); font-weight:800; font-size:clamp(1.8rem,5vw,2.6rem); margin-top:0.4rem; }

  .btn{ padding:0.75rem 1.2rem; border-radius:10px; font-weight:700; font-size:0.88rem; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:#ff744f; }
  .btn-ghost{ background:none; color:var(--paper); border:1px solid var(--line-2); }
  .btn-ghost:hover{ border-color:var(--paper); }

  /* ---------- Login ---------- */
  .login{
    max-width:24rem; margin:clamp(2rem,10vh,6rem) auto 0;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:clamp(1.5rem,4vw,2.25rem); display:flex; flex-direction:column; gap:0.8rem;
  }
  .login input{
    font:inherit; font-size:0.9rem; padding:0.85rem 1rem; width:100%;
    border:1px solid var(--line-2); border-radius:10px; background:var(--ink); color:var(--paper);
  }
  .login input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .status{ font-size:0.85rem; color:var(--accent); min-height:1.2em; }

  /* ---------- Dashboard ---------- */
  .topbar{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:2rem; }
  .who{ font-family:var(--font-mono); font-size:0.78rem; color:var(--muted); margin-top:0.4rem; overflow-wrap:anywhere; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:clamp(1rem,3vw,1.5rem); margin-bottom:1.5rem; }
  .panel-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.75rem; margin-bottom:1rem; }
  .panel-head h2{ font-family:var(--font-display); font-weight:700; font-size:1.35rem; }
  .count{ color:var(--spark); font-family:var(--font-mono); font-size:0.95rem; margin-left:0.4rem; }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  th{ text-align:left; font-family:var(--font-mono); font-weight:400; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted-2); padding:0 0.75rem 0.6rem 0; border-bottom:1px solid var(--line-2); }
  td{ padding:0.7rem 0.75rem 0.7rem 0; border-bottom:1px solid var(--line); vertical-align:top; }
  td.msg{ white-space:pre-wrap; overflow-wrap:anywhere; min-width:14rem; }
  td.date, td.email{ white-space:nowrap; color:var(--muted); }
  td.date{ font-family:var(--font-mono); font-size:0.78rem; }
  .empty{ color:var(--muted-2); font-size:0.9rem; padding:0.5rem 0; }
</style>

<main>
  <!-- Sin sesión: solo el login -->
  <form class="login" id="loginView" hidden>
    <span class="eyebrow">Hap · Admin</span>
    <h1>Entrar</h1>
    <input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="username" required>
    <input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Iniciar sesión</button>
    <p class="status" id="loginStatus" aria-live="polite"></p>
  </form>

  <!-- Con sesión de admin: los datos -->
  <div id="dashboard" hidden>
    <div class="topbar">
      <div>
        <span class="eyebrow">Hap · Admin</span>
        <h1>Lista de espera y comentarios</h1>
        <p class="who" id="whoami"></p>
      </div>
      <button class="btn btn-ghost" id="logout" type="button">Cerrar sesión</button>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Signups<span class="count" id="signupsCount"></span></h2>
        <button class="btn btn-primary" id="downloadCsv" type="button">Descargar CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Fecha</th></tr></thead>
          <tbody id="signupsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Feedback<span class="count" id="feedbackCount"></span></h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Comentario</th><th>Email</th><th>Fecha</th></tr></thead>
          <tbody id="feedbackBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const db = supabase.createClient(HAP_CONFIG.supabaseUrl, HAP_CONFIG.supabaseKey);
  const $ = id => document.getElementById(id);
  let signups = [];

  // Supabase devuelve como máximo 1000 filas por consulta: pedimos de a páginas
  async function fetchAll(table, cols){
    const pageSize = 1000, rows = [];
    for(let from = 0; ; from += pageSize){
      const { data, error } = await db.from(table).select(cols)
        .order('created_at', { ascending:false })
        .range(from, from + pageSize - 1);
      if(error) throw error;
      rows.push(...data);
      if(data.length < pageSize) return rows;
    }
  }

  const fmtDate = iso => new Date(iso).toLocaleString('es', { dateStyle:'medium', timeStyle:'short' });

  // Los datos vienen de visitantes: siempre textContent, nunca innerHTML
  function renderRows(tbody, rows, cells, colspan){
    tbody.replaceChildren();
    if(!rows.length){
      const td = document.createElement('td');
      td.colSpan = colspan; td.className = 'empty'; td.textContent = 'Todavía no hay nada.';
      tbody.append(document.createElement('tr')); tbody.firstChild.append(td);
      return;
    }
    for(const row of rows){
      const tr = document.createElement('tr');
      for(const [value, cls] of cells(row)){
        const td = document.createElement('td');
        td.className = cls; td.textContent = value;
        tr.append(td);
      }
      tbody.append(tr);
    }
  }

  function showLogin(message = ''){
    signups = [];
    $('signupsBody').replaceChildren(); $('feedbackBody').replaceChildren();
    $('dashboard').hidden = true;
    $('loginView').hidden = false;
    $('loginStatus').textContent = message;
  }

  async function showDashboard(user){
    // ¿Este usuario está en la lista de admins?
    const { data: admin, error } = await db.from('admins').select('user_id').eq('user_id', user.id).maybeSingle();
    if(error || !admin){
      await db.auth.signOut();
      showLogin('Esta cuenta no tiene acceso.');
      return;
    }
    $('loginView').hidden = true;
    $('dashboard').hidden = false;
    $('whoami').textContent = user.email;
    try{
      const [s, f] = await Promise.all([
        fetchAll('signups', 'email, created_at'),
        fetchAll('feedback', 'message, email, created_at'),
      ]);
      signups = s;
      $('signupsCount').textContent = `(${s.length})`;
      $('feedbackCount').textContent = `(${f.length})`;
      renderRows($('signupsBody'), s, r => [[r.email,'email'], [fmtDate(r.created_at),'date']], 2);
      renderRows($('feedbackBody'), f, r => [[r.message,'msg'], [r.email || '—','email'], [fmtDate(r.created_at),'date']], 3);
    } catch(err){
      console.error(err);
      $('signupsCount').textContent = $('feedbackCount').textContent = '';
      renderRows($('signupsBody'), [], null, 2);
      $('signupsBody').querySelector('td').textContent = 'No se pudieron cargar los datos.';
    }
  }

  // CSV: comillas escapadas y sin fórmulas al abrirlo en Excel/Sheets
  function csvCell(value){
    let v = String(value ?? '');
    if(/^[=+\-@\t\r]/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  }

  $('downloadCsv').addEventListener('click', ()=>{
    const lines = [['email','created_at'], ...signups.map(r => [r.email, r.created_at])]
      .map(row => row.map(csvCell).join(','));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `signups-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('loginView').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const button = e.target.querySelector('button');
    button.disabled = true;
    $('loginStatus').textContent = '';
    const { error } = await db.auth.signInWithPassword({ email: fd.get('email').trim(), password: fd.get('password') });
    button.disabled = false;
    if(error){ $('loginStatus').textContent = 'Email o contraseña incorrectos.'; return; }
    e.target.reset();
  });

  $('logout').addEventListener('click', ()=> db.auth.signOut());

  // Mantiene la sesión al recargar y alterna entre login y datos
  db.auth.onAuthStateChange((event, session)=>{
    if(event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;
    // diferido: no llamar a Supabase dentro del propio callback
    setTimeout(()=> session ? showDashboard(session.user) : showLogin(), 0);
  });
</script>
