<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testigo Supabase</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: system-ui, sans-serif; background: #fff; color: #111; padding: 16px; box-sizing: border-box; text-align: center; }
  button { font-size: 20px; padding: 14px 28px; border-radius: 10px; border: 0; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #veredicto { font-size: clamp(48px, 14vw, 120px); font-weight: 800; letter-spacing: .02em; }
  #veredicto.ok { color: #16a34a; }
  #veredicto.error { color: #dc2626; }
  #detalle { font-size: 18px; max-width: 640px; color: #444; word-break: break-word; }
</style>
</head>
<body>
  <button id="insertar">Insertar Signup</button>
  <div id="veredicto"></div>
  <div id="detalle"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Valores públicos escritos aquí a propósito: esta página no depende de ningún otro archivo del proyecto.
  const SUPABASE_URL = "https://aqczuqfqobkcfxxhieif.supabase.co";
  const SUPABASE_KEY = "sb_publishable_YguFC0uppLDienyfqEJKPA_oMMzlaBU";
  const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const boton = document.getElementById('insertar');
  const veredicto = document.getElementById('veredicto');
  const detalle = document.getElementById('detalle');

  boton.addEventListener('click', async () => {
    boton.disabled = true;
    veredicto.className = '';
    veredicto.textContent = '…';
    detalle.textContent = '';

    // Sin .select(): un visitante anónimo puede insertar pero no leer.
    const { error } = await cliente.from('signups').insert({ email: 'testigo@prueba.com' });

    if (error) {
      veredicto.className = 'error';
      veredicto.textContent = 'RECHAZADA';
      detalle.textContent = error.message + (error.code ? ` (código ${error.code})` : '');
    } else {
      veredicto.className = 'ok';
      veredicto.textContent = 'ACEPTADA';
      detalle.textContent = 'La base guardó la fila testigo@prueba.com';
    }
    boton.disabled = false;
  });
</script>
</body>
</html>
